steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file
      - infra/cloudrun/Dockerfile
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/regimpact-api:${_TAG}
      - .
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/regimpact-api:${_TAG}
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 1200s
substitutions:
  _REGION: asia-south1
  _REPOSITORY: regimpact
  _TAG: manual
